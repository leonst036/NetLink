<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetLink - SSH Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            padding: 20px;
        }

        #terminal-container {
            width: 100%;
            height: 80vh;
            background-color: #000;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h2>NetLink Remote SSH Session</h2>
    <div id="terminal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

    <script>
        // Since xterm.js exposes itself globally when loaded via script tag:
        const term = new Terminal({
            cursorBlink: true,
            fontFamily: 'monospace',
            fontSize: 14
        });

        term.open(document.getElementById('terminal-container'));
        term.write('Connecting to local proxy...\r\n');

        // Parse query params to make WebSocket connection parameters dynamic
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJkZXZpY2VJZCI6Im15LWxvY2FsLXNlcnZlciIsInJvbGUiOiJzZXJ2ZXIiLCJpYXQiOjE3ODM2MTY0NjJ9.BMhGKd5x1dLbP6D2pDke8HsDkKKRK3FMPtjGODmEwF8';
        const target = urlParams.get('target') || 'my-local-server';

        // Connect back to the same origin host and protocol dynamically
        const isSecure = window.location.protocol === 'https:';
        const protocol = isSecure ? 'wss:' : 'ws:';
        
        // Since WebSocket runs on port 4536, dynamically use hostname with WebSocket port
        const wsPort = '4536';
        let host = window.location.hostname ? `${window.location.hostname}:${wsPort}` : `87.155.145.8:${wsPort}`;

        const socketUrl = `${protocol}//${host}/client?token=${token}&target=${target}`;

        term.write(`Connecting to relay at ${socketUrl}...\r\n`);
        const socket = new WebSocket(socketUrl);

        socket.onopen = () => term.write('Connected.\r\n');
        socket.onmessage = (event) => term.write(event.data);
        term.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) socket.send(data);
        });
    </script>
</body>

</html>
